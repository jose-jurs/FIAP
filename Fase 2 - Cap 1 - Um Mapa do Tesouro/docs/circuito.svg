<svg xmlns="http://www.w3.org/2000/svg" width="860" height="560" viewBox="0 0 860 560" font-family="Segoe UI, Arial, sans-serif">
  <rect width="860" height="560" fill="#0f1b24"/>
  <text x="430" y="34" fill="#e8c87a" font-size="20" font-weight="bold" text-anchor="middle">FarmTech Fase 2 - Sistema de Irrigacao Inteligente (ESP32)</text>
  <text x="430" y="56" fill="#9fb3c0" font-size="12" text-anchor="middle">Diagrama logico das ligacoes - cultura: cafe</text>

  <!-- ESP32 -->
  <rect x="330" y="150" width="200" height="260" rx="10" fill="#132a1e" stroke="#2f9e6b" stroke-width="2"/>
  <text x="430" y="180" fill="#8fe3b4" font-size="16" font-weight="bold" text-anchor="middle">ESP32 DevKit</text>

  <!-- left pins -->
  <text x="345" y="215" fill="#cfe8dc" font-size="12">D18</text>
  <text x="345" y="245" fill="#cfe8dc" font-size="12">D19</text>
  <text x="345" y="275" fill="#cfe8dc" font-size="12">D5</text>
  <text x="345" y="305" fill="#cfe8dc" font-size="12">D34</text>
  <text x="345" y="335" fill="#cfe8dc" font-size="12">D15</text>
  <!-- right pins -->
  <text x="490" y="215" fill="#cfe8dc" font-size="12" text-anchor="end">D23</text>
  <text x="490" y="245" fill="#cfe8dc" font-size="12" text-anchor="end">D21</text>
  <text x="490" y="275" fill="#cfe8dc" font-size="12" text-anchor="end">D22</text>
  <text x="490" y="335" fill="#cfe8dc" font-size="12" text-anchor="end">3V3/5V</text>
  <text x="490" y="365" fill="#cfe8dc" font-size="12" text-anchor="end">GND</text>

  <!-- Buttons N P K -->
  <g>
    <rect x="60" y="195" width="150" height="34" rx="6" fill="#1c3a26" stroke="#49c17e"/>
    <text x="135" y="217" fill="#b9f3d2" font-size="13" text-anchor="middle">Botao N (verde)</text>
    <line x1="210" y1="212" x2="340" y2="210" stroke="#49c17e" stroke-width="2"/>

    <rect x="60" y="235" width="150" height="34" rx="6" fill="#1c3a26" stroke="#49c17e"/>
    <text x="135" y="257" fill="#b9f3d2" font-size="13" text-anchor="middle">Botao P (verde)</text>
    <line x1="210" y1="252" x2="340" y2="240" stroke="#49c17e" stroke-width="2"/>

    <rect x="60" y="275" width="150" height="34" rx="6" fill="#1c3a26" stroke="#49c17e"/>
    <text x="135" y="297" fill="#b9f3d2" font-size="13" text-anchor="middle">Botao K (verde)</text>
    <line x1="210" y1="292" x2="340" y2="270" stroke="#49c17e" stroke-width="2"/>
  </g>

  <!-- LDR -->
  <rect x="60" y="315" width="150" height="34" rx="6" fill="#2a2a1c" stroke="#d6c25a"/>
  <text x="135" y="337" fill="#f0e6a8" font-size="13" text-anchor="middle">LDR = pH (AO)</text>
  <line x1="210" y1="332" x2="340" y2="300" stroke="#d6c25a" stroke-width="2"/>

  <!-- DHT22 -->
  <rect x="60" y="355" width="150" height="34" rx="6" fill="#1c2a3a" stroke="#5a9fd6"/>
  <text x="135" y="377" fill="#bcdcf5" font-size="13" text-anchor="middle">DHT22 = umidade</text>
  <line x1="210" y1="372" x2="340" y2="330" stroke="#5a9fd6" stroke-width="2"/>

  <!-- Relay / pump -->
  <rect x="650" y="190" width="160" height="50" rx="8" fill="#13233a" stroke="#4f8fe0" stroke-width="2"/>
  <text x="730" y="212" fill="#bcdcf5" font-size="13" text-anchor="middle">Rele azul (IN)</text>
  <text x="730" y="230" fill="#9fb3c0" font-size="11" text-anchor="middle">bomba d'agua</text>
  <line x1="530" y1="210" x2="650" y2="212" stroke="#e08a4f" stroke-width="2"/>

  <!-- LCD -->
  <rect x="650" y="250" width="160" height="50" rx="8" fill="#14231a" stroke="#49c17e" stroke-width="2"/>
  <text x="730" y="272" fill="#b9f3d2" font-size="13" text-anchor="middle">LCD I2C 16x2</text>
  <text x="730" y="290" fill="#9fb3c0" font-size="11" text-anchor="middle">SDA=D21 SCL=D22</text>
  <line x1="530" y1="245" x2="650" y2="268" stroke="#49c17e" stroke-width="2"/>
  <line x1="530" y1="275" x2="650" y2="282" stroke="#49c17e" stroke-width="2"/>

  <text x="430" y="470" fill="#9fb3c0" font-size="12" text-anchor="middle">Botoes em INPUT_PULLUP (pressionado = nutriente presente). LDR mapeado para pH 0-14.</text>
  <text x="430" y="492" fill="#9fb3c0" font-size="12" text-anchor="middle">DHT22 fornece a umidade do solo. Rele liga a bomba conforme a logica de decisao.</text>
  <text x="430" y="528" fill="#6b7f8c" font-size="11" text-anchor="middle">* Diagrama ilustrativo. Substituir/adicionar o print real do circuito no Wokwi.com na entrega.</text>
</svg>
